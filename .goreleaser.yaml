# GoReleaser config for duck — https://goreleaser.com
# Build: darwin arm64 + amd64, pure-Go (CGO_ENABLED=0). On a `vX.Y.Z` tag the
# release Action (.github/workflows/release.yml) runs `goreleaser release`, which
# publishes a GitHub Release carrying RAW per-arch binaries named
# duck-<os>-<arch> (e.g. duck-darwin-arm64). duck installs to ~/.local/bin via
# install.sh and self-updates with `duck update`, which pulls those assets
# straight from the release (mirroring the sibling `cass` tool) — no Homebrew.
version: 2

project_name: duck

before:
  hooks:
    - go mod tidy

builds:
  - id: duck
    main: ./cmd/duck
    binary: duck
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/DigiBugCat/duck/command.version={{ .Version }}

archives:
  # Ship RAW binaries (not tarballs) named duck-<os>-<arch>, with NO version in
  # the name, so `duck update` / install.sh can fetch a stable asset name across
  # releases (mirrors cass-<os>-<arch>).
  - id: duck
    formats:
      - binary
    name_template: "duck-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^style:"
      - "^chore:"

release:
  github:
    owner: DigiBugCat
    name: duck
