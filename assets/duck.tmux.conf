# ~/.tmux.conf on the duck hub — tuned for driving Claude Code over SSH.
# Shipped by `duck hub setup` from duck's embedded assets/duck.tmux.conf.
#
# This is the flok-era duck tmux config MINUS three things the new native client
# makes obsolete (see PLAN section 4 / fix d1):
#   - the auto-rename detach hook (sessions are never renamed to titles)
#   - the force-rename prefix bind (affordance moved to the native rename action)
#   - the picker-popup prefix bind (a hub-side popup cannot launch the
#     laptop-local picker)
# QoL settings and resurrect/continuum are KEPT.

# ── Quality-of-life ────────────────────────────────────────────────────────
set -g mouse on                 # trackpad scroll, click to select panes/windows
set -g history-limit 50000      # generous scrollback (Claude is verbose)
set -sg escape-time 10          # snappier ESC (avoids vim/TUI lag)
set -g base-index 1             # windows start at 1 (matches keyboard layout)
setw -g pane-base-index 1
set -g renumber-windows on      # keep window numbers gap-free when one closes
set -g focus-events on          # let TUIs know when they gain/lose focus
set -g set-clipboard on         # yank in tmux -> system clipboard (OSC52)
# Declare that the OUTER terminal can receive the clipboard via OSC 52, so
# set-clipboard actually forwards yanks (and Claude Code's own selection, which
# it emits as OSC 52 over SSH) to the CLIENT's clipboard. Without this, tmux's
# terminfo carries no `Ms` capability for these TERMs (xterm-256color/-kitty/
# -ghostty/tmux-256color all lack it) and set-clipboard is a SILENT no-op.
# Honored by Ghostty / kitty / iTerm2; harmlessly ignored by Apple Terminal
# (which can't do OSC 52 anyway). Needs tmux >= 3.2.
set -as terminal-features ",*:clipboard"
set -g mode-keys vi             # vi-style navigation in copy/scroll mode
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor for nice TUI rendering

# ── Keybindings ─────────────────────────────────────────────────────────────
# Reload config without restarting: prefix + r
bind r source-file ~/.tmux.conf \; display "config reloaded"

# More intuitive splits that keep the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# duck popups (shipped via `duck hub setup`): prefix-Space = the session-
# manager palette (jump/kill/detach), prefix-f = the every-agent fleet. Both
# are one-shot pickers — they read live state at open and run one tmux verb.
bind-key Space display-popup -E -w 70% -h 60% "duck palette"
bind-key k display-popup -E -w 70% -h 60% "duck palette"
bind-key f display-popup -E -w 80% -h 70% "duck fleet"

# (prefix stays the default Ctrl-b. To switch to Ctrl-a, uncomment:)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# ── Plugins (managed by TPM) ─────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'      # sane baseline defaults
set -g @plugin 'alexwforsythe/tmux-which-key'    # popup menu of keybinding hints
set -g @plugin 'tmux-plugins/tmux-resurrect'     # save/restore sessions manually
set -g @plugin 'tmux-plugins/tmux-continuum'     # auto-save + restore on reboot

# continuum: restore last session automatically when tmux server starts
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'             # autosave every 15 min
# resurrect: also bring back running programs (so `claude` panes come back)
set -g @resurrect-capture-pane-contents 'on'


# Prefix-armed indicator: the whole status bar turns purple (and shows a ⌨
# badge) while tmux waits for the follow-up key (Space=palette, f=fleet).
set -g status-left-length 40
set -g status-left '#{?client_prefix,#[bold] ⌨ ,}[#{session_name}] '
set -g status-style '#{?client_prefix,bg=colour141#,fg=colour232,bg=green#,fg=black}'

# Keep this line LAST: initialize TPM.
run '~/.tmux/plugins/tpm/tpm'
