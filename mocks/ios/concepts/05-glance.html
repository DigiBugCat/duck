<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>duck · glance</title>
<!--
  CONCEPT 05 — "GLANCE": widget-grid control room. Every tile maps to an audited data source.

  UI MODULE -> DATA SOURCE MAP
  - Portfolio hero tile / expanded chart .......... BROKER: account (total value, cash, buying power) + positions; chart series synthesized from BROKER account history (1D intraday via MARKET DATA intraday_prices rollup)
  - Day movers tile / all-positions detail ........ BROKER: positions (qty/market_value/average_price) + per-symbol quote (net_change_pct); per-position day P/L (SOON: currentDayProfitLoss)
  - Approvals tile / swipe deck ................... AGENTS (flock hub): trade proposals with rationale + approve/deny decisions; BROKER: place/preview orders via human approval gate
  - Flock status tile / agents detail ............. AGENTS: automation status (heartbeat/cron, running/paused) + run events
  - Next earnings tile / calendar detail .......... EVENTS: earnings_calendar (date, EPS estimate, prior surprise) + economic_calendar (CPI/FOMC) + treasury_auctions
  - Sector heatmap tile / detail .................. MARKET CONTEXT: sector_performance + index_performance (SPY/QQQ/IWM) + market_overview (VIX)
  - Macro tile / detail ........................... MACRO: treasury_rates (2Y/10Y/30Y) + economy_indicators (CPI, PCE, unemployment); MARKET CONTEXT: market_overview (VIX)
  - News tile / headlines detail .................. NEWS & FILINGS: market_news (per-symbol headlines + snippets + source + timestamp)
  - Crypto & commodities tile / detail ............ MACRO: commodity/crypto/forex quotes
  - Realized P/L today tile / fills detail ........ BROKER (SOON): transactions feed (fills/dividends, 60d) + order status
-->
<style>
  :root {
    --paper: #f3f1ea;
    --tile: #ffffff;
    --ink: #181b1f;
    --mut: #757b84;
    --faint: #a8adb5;
    --line: #e7e4da;
    --up: #0b8a5c;
    --up-soft: rgba(11,138,92,.10);
    --dn: #d23c3c;
    --dn-soft: rgba(210,60,60,.09);
    --agent: #3b5bdb;
    --agent-soft: rgba(59,91,219,.09);
    --gold: #b07c10;
    --shadow: 0 1px 2px rgba(24,27,31,.05), 0 10px 28px rgba(24,27,31,.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1100px 700px at 30% -10%, #23262b 0%, #101113 60%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
    user-select: none;
  }
  .phone {
    width: 393px; height: 852px;
    background: var(--paper);
    border-radius: 54px; border: 1px solid #2a2e35;
    box-shadow: 0 0 0 11px #16181c, 0 0 0 12.5px #3a3e46, 0 40px 90px rgba(0,0,0,.7);
    overflow: hidden; position: relative;
    display: flex; flex-direction: column;
  }
  @media (max-width: 500px), (max-height: 940px) and (max-width: 940px) {
    body { padding: 0; }
    .phone {
      width: 100vw; height: 100dvh;
      border-radius: 0; border: none; box-shadow: none;
    }
    .island { display: none; }
    .statusbar { height: calc(env(safe-area-inset-top, 14px) + 14px) !important; }
    .statusbar span { display: none; }
    .homebar { display: none; }
  }
  .island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 122px; height: 36px; background: #000; border-radius: 20px; z-index: 90; }
  .statusbar { height: 59px; flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 32px 8px; font-size: 15px; font-weight: 600; z-index: 85; color: var(--ink); }
  .statusbar .icons { display: flex; gap: 7px; font-size: 13px; }
  .homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; border-radius: 3px; background: #16181c; opacity: .28; z-index: 95; pointer-events: none; }

  .main { flex: 1; position: relative; min-height: 0; display: flex; flex-direction: column; }

  /* ============ header ============ */
  .ghead { flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 6px 20px 12px; }
  .wm { font-family: ui-serif, "New York", Georgia, serif; font-style: italic; font-weight: 700; font-size: 32px; letter-spacing: -.5px; line-height: 1; }
  .wm .duck { font-style: normal; font-size: 15px; vertical-align: 6px; margin-right: 2px; }
  .wdate { font-size: 12.5px; color: var(--mut); font-weight: 600; margin-top: 5px; }
  .hright { display: flex; align-items: center; gap: 8px; }
  .hubpill { display: flex; align-items: center; gap: 6px; background: var(--tile); border: 1px solid var(--line); padding: 6px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 650; color: var(--mut); box-shadow: var(--shadow); }
  .hdot { width: 7px; height: 7px; border-radius: 50%; background: var(--up); box-shadow: 0 0 7px rgba(11,138,92,.8); }
  #editbtn {
    border: 1px solid var(--line); background: var(--tile); color: var(--mut);
    font-family: inherit; font-size: 12px; font-weight: 750; padding: 7px 13px;
    border-radius: 999px; cursor: pointer; box-shadow: var(--shadow);
    transition: background .2s, color .2s, transform .12s;
  }
  #editbtn:active { transform: scale(.94); }
  #editbtn.done { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* ============ grid ============ */
  .gridscroll { flex: 1; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 2px 16px 8px; }
  .tile {
    position: relative; border-radius: 24px; min-height: 148px;
    background: var(--tile); border: 1px solid var(--line);
    box-shadow: var(--shadow);
    cursor: pointer; touch-action: none;
    animation: tilein .45s cubic-bezier(.32,.72,.27,1) backwards;
  }
  @keyframes tilein { from { opacity: 0; transform: translateY(14px) scale(.97); } }
  .tile.w2 { grid-column: span 2; min-height: 184px; }
  .tin { padding: 14px 15px 13px; height: 100%; display: flex; flex-direction: column; border-radius: 24px; }
  .tile:active .tin { transform: scale(.985); transition: transform .15s; }
  .tlabel { font-size: 10px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase; color: var(--faint); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .tlabel .cnt { background: var(--dn); color: #fff; font-size: 10px; min-width: 17px; height: 17px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; letter-spacing: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .dn { color: var(--dn); }

  /* jiggle edit mode */
  @keyframes jig { 0% { transform: rotate(-1.3deg); } 100% { transform: rotate(1.3deg); } }
  .grid.editing .tile { cursor: grab; }
  .grid.editing .tile .tin { animation: jig .27s ease-in-out infinite alternate; }
  .grid.editing .tile:nth-child(even) .tin { animation-delay: -.135s; }
  .minus {
    position: absolute; top: -7px; left: -7px; z-index: 5;
    width: 25px; height: 25px; border-radius: 50%; border: none;
    background: #43474e; color: #fff; font-size: 16px; line-height: 1;
    display: none; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,.3);
    font-family: inherit;
  }
  .grid.editing .minus { display: flex; }
  .tile.lift { z-index: 40; box-shadow: 0 18px 44px rgba(24,27,31,.28); cursor: grabbing; }
  .tile.lift .tin { animation: none !important; }
  .tile.hideout { transition: transform .22s ease, opacity .22s ease; transform: scale(.5); opacity: 0; }
  .hiddenrow { display: none; margin: 6px 16px 0; }
  .grid-wrap.editing .hiddenrow.has { display: block; }
  .hiddenrow button {
    width: 100%; border: 1.5px dashed var(--faint); background: none; color: var(--mut);
    border-radius: 18px; padding: 13px; font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .gfoot { text-align: center; font-size: 10.5px; color: var(--faint); font-weight: 600; padding: 16px 0 calc(28px + env(safe-area-inset-bottom, 0px)); }

  /* ---- hero tile ---- */
  .bigval { font-size: 40px; font-weight: 800; letter-spacing: -1.4px; font-variant-numeric: tabular-nums; margin-top: 8px; line-height: 1.05; }
  .bigchg { font-size: 14px; font-weight: 750; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .bigchg span { color: var(--faint); font-weight: 600; font-size: 12px; }
  .hspark { display: block; width: 100%; height: 56px; margin-top: auto; }

  /* ---- movers tile ---- */
  .mrow { display: flex; align-items: baseline; justify-content: space-between; margin-top: 11px; }
  .mrow .t { font-size: 17px; font-weight: 800; letter-spacing: -.3px; }
  .mrow .p { font-size: 15px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .msub { font-size: 10.5px; color: var(--faint); font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 1px; }

  /* ---- approvals tile ---- */
  .aptop { margin-top: 10px; display: flex; align-items: baseline; gap: 7px; }
  .aptop .t { font-size: 19px; font-weight: 800; letter-spacing: -.4px; }
  .apside { font-size: 9.5px; font-weight: 900; letter-spacing: 1px; padding: 2.5px 7px; border-radius: 6px; }
  .apside.sell { background: var(--dn-soft); color: var(--dn); }
  .apside.buy { background: var(--up-soft); color: var(--up); }
  .apline { font-size: 11.5px; color: var(--mut); font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .apagent { font-size: 10px; color: var(--agent); font-weight: 750; margin-top: 4px; }
  .qarow { display: flex; gap: 7px; margin-top: auto; }
  .qa { flex: 1; border: none; border-radius: 11px; padding: 8px 0; font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer; transition: transform .12s; }
  .qa:active { transform: scale(.94); }
  .qa.ok { background: var(--ink); color: var(--paper); }
  .qa.no { background: #eceae2; color: var(--mut); }
  .apclear { margin: auto 0; text-align: center; color: var(--faint); font-size: 12px; font-weight: 650; }
  .apclear .e { font-size: 26px; display: block; margin-bottom: 4px; }

  /* ---- flock tile ---- */
  .frow { display: flex; align-items: center; gap: 7px; margin-top: 9px; font-size: 12px; font-weight: 700; }
  .fdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .fdot.live { background: var(--up); box-shadow: 0 0 6px rgba(11,138,92,.7); animation: fpulse 1.8s infinite; }
  .fdot.wait { background: var(--agent); }
  .fdot.idle { background: var(--faint); }
  @keyframes fpulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  .frow .fs { margin-left: auto; font-size: 9.5px; font-weight: 800; letter-spacing: .6px; color: var(--faint); text-transform: uppercase; }
  .flast { margin-top: auto; font-size: 10.5px; line-height: 1.45; color: var(--mut); border-top: 1px solid var(--line); padding-top: 8px; }
  .flast b { color: var(--agent); }

  /* ---- earnings tile ---- */
  .ebig { display: flex; align-items: baseline; gap: 8px; margin-top: 12px; }
  .ebig .t { font-size: 26px; font-weight: 800; letter-spacing: -.6px; }
  .ebig .in { font-size: 15px; font-weight: 800; color: var(--gold); }
  .esub { font-size: 11px; color: var(--mut); font-weight: 600; margin-top: 4px; line-height: 1.5; }
  .enext { margin-top: auto; font-size: 10.5px; color: var(--faint); font-weight: 650; border-top: 1px solid var(--line); padding-top: 8px; font-variant-numeric: tabular-nums; }

  /* ---- sector tile ---- */
  .heat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 11px; flex: 1; }
  .hc { border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 30px; }
  .hc .n { font-size: 9px; font-weight: 800; letter-spacing: .2px; }
  .hc .v { font-size: 9px; font-weight: 700; font-variant-numeric: tabular-nums; opacity: .75; }

  /* ---- macro tile ---- */
  .y10 { display: flex; align-items: baseline; gap: 7px; margin-top: 11px; }
  .y10 .v { font-size: 27px; font-weight: 800; letter-spacing: -.6px; font-variant-numeric: tabular-nums; }
  .y10 .d { font-size: 12px; font-weight: 750; }
  .mline { font-size: 11px; color: var(--mut); font-weight: 650; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .mline b { color: var(--ink); }

  /* ---- news tile ---- */
  .ndots { display: flex; gap: 4px; }
  .ndots i { width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--line); }
  .ndots i.on { background: var(--mut); }
  .nhead { font-size: 12.5px; font-weight: 700; line-height: 1.42; margin-top: 10px; transition: opacity .25s; }
  .nsrc { margin-top: auto; font-size: 10px; color: var(--faint); font-weight: 700; display: flex; gap: 6px; align-items: center; }
  .nsrc .tk { color: var(--agent); }

  /* ---- crypto tile ---- */
  .crow { display: flex; align-items: baseline; justify-content: space-between; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .crow .n { font-size: 11.5px; font-weight: 750; color: var(--mut); }
  .crow .v { font-size: 12px; font-weight: 750; }
  .crow .c { font-size: 10.5px; font-weight: 750; width: 44px; text-align: right; }

  /* ---- realized tile ---- */
  .rzval { font-size: 27px; font-weight: 800; letter-spacing: -.7px; font-variant-numeric: tabular-nums; margin-top: 12px; }
  .rzsub { font-size: 11px; color: var(--mut); font-weight: 650; margin-top: 4px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .rzfoot { margin-top: auto; font-size: 10.5px; color: var(--faint); font-weight: 650; border-top: 1px solid var(--line); padding-top: 8px; }

  /* ============ detail overlay (FLIP expand) ============ */
  .detail {
    position: absolute; inset: 0; z-index: 60;
    background: var(--paper);
    display: none; flex-direction: column;
    transform-origin: 0 0;
    transition: transform .46s cubic-bezier(.3,.72,.25,1), border-radius .46s cubic-bezier(.3,.72,.25,1);
    border-radius: 24px; overflow: hidden;
    will-change: transform;
  }
  .detail.show { display: flex; }
  .detail.open { border-radius: 0; }
  .dhead { flex: none; display: flex; align-items: center; gap: 4px; padding: 8px 12px 10px; }
  .dback { border: none; background: none; color: var(--ink); font-size: 30px; line-height: 1; padding: 2px 10px; cursor: pointer; font-family: inherit; }
  .dtitle { font-size: 19px; font-weight: 800; letter-spacing: -.3px; }
  .dsub { margin-left: auto; font-size: 11px; color: var(--faint); font-weight: 700; font-variant-numeric: tabular-nums; }
  .dbody { flex: 1; overflow-y: auto; min-height: 0; padding: 0 18px calc(40px + env(safe-area-inset-bottom, 0px)); opacity: 0; transition: opacity .25s ease .18s; }
  .detail.open .dbody { opacity: 1; }
  .dcard { background: var(--tile); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
  .dlabel { font-size: 10.5px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase; color: var(--faint); padding: 18px 4px 8px; }

  /* portfolio detail */
  .pval { font-size: 44px; font-weight: 800; letter-spacing: -1.6px; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .pchg { font-size: 15px; font-weight: 750; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .pchg span { color: var(--faint); font-weight: 600; font-size: 12.5px; }
  .chartwrap { position: relative; margin: 14px -6px 0; touch-action: none; }
  .chartwrap svg { display: block; width: 100%; height: 224px; }
  .scrublabel {
    position: absolute; top: -6px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper);
    font-size: 11px; font-weight: 750; font-variant-numeric: tabular-nums;
    padding: 4px 9px; border-radius: 8px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .scrublabel.on { opacity: 1; }
  .rpills { display: flex; gap: 4px; margin-top: 10px; }
  .rpills button {
    flex: 1; border: none; background: none; color: var(--faint);
    font-size: 11.5px; font-weight: 800; padding: 7px 0; border-radius: 9px;
    font-family: inherit; cursor: pointer; transition: background .15s, color .15s;
  }
  .rpills button.on { background: var(--ink); color: var(--paper); }
  .statgrid { display: flex; gap: 9px; margin-top: 18px; }
  .stat { flex: 1; background: var(--tile); border: 1px solid var(--line); border-radius: 16px; padding: 11px 12px; box-shadow: var(--shadow); }
  .stat .k { font-size: 9.5px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--faint); }
  .stat .v { font-size: 14.5px; font-weight: 750; margin-top: 4px; font-variant-numeric: tabular-nums; }

  /* position rows */
  .prow { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
  .dcard .prow:last-child { border-bottom: none; }
  .prow .sym { width: 58px; flex: none; }
  .prow .sym .t { font-size: 15px; font-weight: 800; letter-spacing: -.2px; }
  .prow .sym .q { font-size: 10px; color: var(--faint); font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .pbar { flex: 1; height: 5px; border-radius: 3px; background: #f0eee6; position: relative; overflow: hidden; }
  .pbar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .prow .nums { flex: none; text-align: right; width: 116px; }
  .prow .mv { font-size: 14px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .prow .pl { font-size: 11px; font-weight: 750; margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* generic detail rows */
  .drow { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
  .dcard .drow:last-child { border-bottom: none; }
  .drow .ic { width: 36px; height: 36px; flex: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; background: #f2f0e8; }
  .drow .bd { flex: 1; min-width: 0; }
  .drow .ti { font-size: 13.5px; font-weight: 700; line-height: 1.35; }
  .drow .su { font-size: 11px; color: var(--mut); margin-top: 2px; line-height: 1.45; font-variant-numeric: tabular-nums; }
  .drow .rt { flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .drow .rv { font-size: 13.5px; font-weight: 750; }
  .drow .rs { font-size: 10px; color: var(--faint); font-weight: 650; margin-top: 2px; }

  /* news detail */
  .nitem { padding: 14px 15px; border-bottom: 1px solid var(--line); }
  .dcard .nitem:last-child { border-bottom: none; }
  .nitem .h { font-size: 13.5px; font-weight: 750; line-height: 1.4; }
  .nitem .s { font-size: 11.5px; color: var(--mut); line-height: 1.5; margin-top: 5px; }
  .nitem .m { font-size: 10px; color: var(--faint); font-weight: 750; margin-top: 7px; display: flex; gap: 8px; }
  .nitem .m .tk { color: var(--agent); }

  /* approvals deck */
  .deckwrap { position: relative; height: 430px; margin-top: 6px; }
  .pcard {
    position: absolute; inset: 0;
    background: var(--tile); border: 1px solid var(--line); border-radius: 24px;
    box-shadow: var(--shadow); padding: 18px 18px 16px;
    display: flex; flex-direction: column;
    touch-action: none; cursor: grab; overflow: hidden;
    transition: transform .3s cubic-bezier(.32,.72,.27,1), opacity .3s;
  }
  .pcard.dragging { transition: none; cursor: grabbing; }
  .pcard.b1 { transform: scale(.95) translateY(14px); opacity: .75; z-index: 2; }
  .pcard.b2 { transform: scale(.90) translateY(28px); opacity: .45; z-index: 1; }
  .pcard.topc { z-index: 3; }
  .pcard.fly { transition: transform .4s ease, opacity .35s; opacity: 0; }
  .pcsym { font-size: 36px; font-weight: 850; letter-spacing: -1.2px; margin-top: 10px; }
  .pcorder { margin-top: 8px; font-size: 16px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .pcorder span { color: var(--faint); font-weight: 600; font-size: 13px; }
  .pcest { font-size: 11.5px; color: var(--mut); font-weight: 650; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .pcwhy { margin-top: 13px; flex: 1; font-size: 12.5px; line-height: 1.55; color: #4c5158; border-left: 3px solid var(--agent); padding-left: 12px; overflow: hidden; }
  .pcwhy .who { display: block; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--agent); margin-bottom: 4px; }
  .pcexp { font-size: 11px; color: var(--faint); font-weight: 650; text-align: center; margin-top: 10px; }
  .pcexp b { color: var(--gold); }
  .stamp { position: absolute; top: 64px; font-size: 28px; font-weight: 900; letter-spacing: 2px; padding: 5px 16px; border-radius: 10px; border: 4px solid; opacity: 0; transform: rotate(-12deg); pointer-events: none; }
  .stamp.yes { left: 18px; color: var(--up); border-color: var(--up); }
  .stamp.no { right: 18px; color: var(--dn); border-color: var(--dn); transform: rotate(12deg); }
  .deckbtns { display: flex; justify-content: center; gap: 22px; margin-top: 14px; }
  .deckbtns button { width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--line); background: var(--tile); font-size: 23px; cursor: pointer; font-family: inherit; box-shadow: var(--shadow); transition: transform .12s; }
  .deckbtns button:active { transform: scale(.9); }
  .deckbtns .y { color: var(--up); } .deckbtns .n { color: var(--dn); }

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const RCFG = {
  "1D":  { start: PREV,      n: 79,  seed: 7,  vol: 520,   lbl: "today" },
  "1W":  { start: 286900.00, n: 110, seed: 21, vol: 1100,  lbl: "past week" },

  "YTD": { start: 251840.00, n: 140, seed: 59, vol: 4600,  lbl: "year to date" },
  "ALL": { start: 118400.00, n: 160, seed: 64, vol: 15000, lbl: "past 5 years" },
};
const SERIES = {};
for (const k in RCFG) {
  const c = RCFG[k], r = rng(c.seed), w = [0];
  for (let i = 1; i < c.n; i++) w.push(w[i - 1] + (r() - 0.5));
  const w0 = w[0], wn = w[c.n - 1];

  });
}
function tlabel(range, t) {
  if (range === "1D") {
    const m = 570 + Math.round(t * 390);

    return h12 + ":" + String(mm).padStart(2, "0") + (h >= 12 ? " PM" : " AM");
  }
  const spans = { "1W": 7, "1M": 30, "3M": 91, "YTD": 159, "ALL": 1826 };
  const d = new Date(2026, 5, 9);
  d.setDate(d.getDate() - Math.round((1 - t) * spans[range]));

  return mo + " " + d.getDate() + (range === "ALL" ? " ’" + String(d.getFullYear()).slice(2) : "");
}
function pathFrom(series, W, H, pad) {
  const min = Math.min(...series), max = Math.max(...series), span = max - min || 1;
  const pts = series.map((v, i) => [i / (series.length - 1) * W, pad + (max - v) / span * (H - pad * 2)]);
  const line = "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L");
  const area = line + "L" + W + " " + H + "L0 " + H + "Z";
  return { line, area, pts };
}

}

function countUpHero() {
  const elv = $("#heroval");

  const t0 = performance.now(), dur = 950;
  function step(now) {
    const t = Math.min(1, (now - t0) / dur);
    const ease = 1 - Math.pow(1 - t, 3);
    elv.textContent = fmt$(PREV + DAY * ease);
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function applyOrderFLIP(draggedEl) {
  const before = new Map();

  for (const id of state.order) {
    const t = grid.querySelector('.tile[data-id="' + id + '"]');

    const dx = b.left - a.left, dy = b.top - a.top;
    if (dx || dy) {
      t.style.transition = "none";
      t.style.transform = "translate(" + dx + "px," + dy + "px)";
      requestAnimationFrame(() => {
        t.style.transition = "transform .28s cubic-bezier(.32,.72,.27,1)";
        t.style.transform = "";
        setTimeout(() => { t.style.transition = ""; }, 300);
      });
    }
  });
  return before.get(draggedEl);
}

function attachTile(tile, id) {
  tile.addEventListener("pointerdown", e => {
    if (e.button !== undefined && e.button !== 0) return;
    const sx = e.clientX, sy = e.clientY;
    let moved = false, dragging = false, lpFired = false;
    let baseRect = null, offX = 0, offY = 0;
    const lp = state.editing ? null : setTimeout(() => { lpFired = true; enterEdit(); }, 520);
    try { tile.setPointerCapture(e.pointerId); } catch (err) {}

    const onMove = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.hypot(dx, dy) > 8) {
        moved = true;
        if (lp) clearTimeout(lp);
        if (state.editing) {
          dragging = true;
          baseRect = tile.getBoundingClientRect();
          tile.classList.add("lift");
          tile.style.transition = "none";
        }
      }
      if (!dragging) return;
      ev.preventDefault();
      tile.style.transform = "translate(" + (dx + offX) + "px," + (dy + offY) + "px) scale(1.05)";
      // hit-test against other tiles
      for (const other of tileEls()) {
        if (other === tile) continue;
        const r = other.getBoundingClientRect();
        if (ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom) {
          const from = state.order.indexOf(id);
          const to = state.order.indexOf(other.dataset.id);
          if (from !== to && to !== -1) {
            state.order.splice(from, 1);
            state.order.splice(to, 0, id);
            applyOrderFLIP(tile);
            const nr = tile.getBoundingClientRect();
            // nr includes current transform; compute pure layout shift via offset reset
            tile.style.transform = "";
            const lr = tile.getBoundingClientRect();
            offX += baseRect.left - lr.left;
            offY += baseRect.top - lr.top;
            baseRect = lr;
            tile.style.transform = "translate(" + (dx + offX) + "px," + (dy + offY) + "px) scale(1.05)";
            void nr;
          }
          break;
        }
      }
    };
    const finish = ev => {
      if (lp) clearTimeout(lp);
      tile.removeEventListener("pointermove", onMove);
      tile.removeEventListener("pointerup", finish);
      tile.removeEventListener("pointercancel", finish);
      if (dragging) {
        tile.style.transition = "transform .3s cubic-bezier(.32,.72,.27,1)";
        tile.style.transform = "";
        setTimeout(() => { tile.classList.remove("lift"); tile.style.transition = ""; }, 310);
        return;
      }
      if (!moved && !lpFired && ev.type === "pointerup" && !state.editing) openDetail(id);
    };
    tile.addEventListener("pointermove", onMove);
    tile.addEventListener("pointerup", finish);
    tile.addEventListener("pointercancel", finish);
  });
}

/* ================= detail overlay (FLIP expand) ================= */
let currentDetail = null;
let closingTimer = null;

function openDetail(id) {
  const cfg = TILES[id];
  const builder = DETAILS[id];
  if (!cfg || !builder) return;
  if (closingTimer) { clearTimeout(closingTimer); closingTimer = null; }
  const overlay = $("#detail");
  overlay.innerHTML = '<div class="dhead"><button class="dback">‹</button><div class="dtitle">' + cfg.title + '</div><div class="dsub">' + (builder.sub || "") + '</div></div><div class="dbody"></div>';
  builder.build(overlay.querySelector(".dbody"));
  overlay.querySelector(".dback").onclick = closeDetail;

  const main = $(".main").getBoundingClientRect();
  const tile = grid.querySelector('.tile[data-id="' + id + '"]');
  if (tile) {
    const r = tile.getBoundingClientRect();
    overlay.style.transition = "none";
    overlay.style.transform = "translate(" + (r.left - main.left) + "px," + (r.top - main.top) + "px) scale(" + (r.width / main.width) + "," + (r.height / main.height) + ")";
  } else {
    overlay.style.transform = "translate(0," + main.height + "px)";
  }
  overlay.classList.add("show");
  requestAnimationFrame(() => requestAnimationFrame(() => {
    overlay.style.transition = "";
    overlay.classList.add("open");
    overlay.style.transform = "";
  }));
  currentDetail = id;
}
function closeDetail() {
  const overlay = $("#detail");
  const id = currentDetail;
  currentDetail = null;
  const main = $(".main").getBoundingClientRect();
  const tile = grid.querySelector('.tile[data-id="' + id + '"]');
  overlay.classList.remove("open");
  if (tile) {
    const r = tile.getBoundingClientRect();
    overlay.style.transform = "translate(" + (r.left - main.left) + "px," + (r.top - main.top) + "px) scale(" + (r.width / main.width) + "," + (r.height / main.height) + ")";
  } else {
    overlay.style.transform = "translate(0," + main.height + "px)";
  }
  closingTimer = setTimeout(() => {
    overlay.classList.remove("show");
    overlay.style.transform = "";
    overlay.innerHTML = "";
    closingTimer = null;
  }, 470);
}

  if (!hostEl) return;
  if (!proposals.length) {
    hostEl.innerHTML = '<div class="deckempty"><span class="e">✓</span>Queue clear — nothing pending<span style="font-size:11px;font-weight:600">new proposals from the flock land here</span></div>'
      + histChips();
    return;
  }
  let html = '<div class="deckwrap" id="deckwrap">';
  const show = proposals.slice(0, 3);
  for (let i = show.length - 1; i >= 0; i--) {
    const p = show[i];
    const layer = i === 0 ? "topc" : i === 1 ? "b1" : "b2";
    html += '<div class="pcard ' + layer + '" data-i="' + i + '">'
      + '<div class="tlabel"><span class="apside ' + p.side.toLowerCase() + '">' + p.side + '</span><span style="color:var(--agent);letter-spacing:.4px">' + p.agent + "</span></div>"
      + '<div class="pcsym">' + p.sym + "</div>"
      + '<div class="pcorder num">' + p.qty + " sh <span>@</span> " + fmt$(p.px) + " <span>limit</span></div>"
      + '<div class="pcest num">est ' + fmt$(p.est) + (p.side === "BUY" ? " · leaves " + fmt$(CASH - p.est).replace(".00", "") + " cash" : " proceeds") + "</div>"
      + '<div class="pcwhy"><span class="who">' + p.agent + " · rationale</span>" + p.why + "</div>"
      + '<div class="pcexp">expires <b>' + p.exp + "</b> · then auto-cancel</div>"
      + '<div class="stamp yes">APPROVE</div><div class="stamp no">DENY</div>'
      + "</div>";
  }
  html += "</div>"
    + '<div class="deckbtns"><button class="n" id="dk-no">✕</button><button class="y" id="dk-yes">✓</button></div>'
    + '<div class="deckhint">swipe right to approve · left to deny · ' + proposals.length + " pending</div>"
    + histChips();
  hostEl.innerHTML = html;

  const top = hostEl.querySelector(".pcard.topc");
  const fxAt = () => {
    const r = hostEl.getBoundingClientRect(), m = $(".main").getBoundingClientRect();
    return [r.left - m.left + r.width / 2, r.top - m.top + 160];
  };
  function fly(ok) {
    top.classList.add("fly");
    top.style.transform = "translateX(" + (ok ? 480 : -480) + "px) rotate(" + (ok ? 18 : -18) + "deg)";
    const [fx, fy] = fxAt();
    setTimeout(() => decide(ok, fx, fy), 240);
  }
  hostEl.querySelector("#dk-yes").onclick = () => fly(true);
  hostEl.querySelector("#dk-no").onclick = () => fly(false);

  top.addEventListener("pointerdown", e => {
    top.setPointerCapture(e.pointerId);
    const sx = e.clientX;
    let dx = 0;
    top.classList.add("dragging");
    const yes = top.querySelector(".stamp.yes"), no = top.querySelector(".stamp.no");
    const mv = ev => {
      dx = ev.clientX - sx;
      top.style.transform = "translateX(" + dx + "px) rotate(" + dx * 0.055 + "deg)";
      yes.style.opacity = Math.max(0, Math.min(1, dx / 90));
      no.style.opacity = Math.max(0, Math.min(1, -dx / 90));
    };
    const up = () => {
      top.removeEventListener("pointermove", mv);
      top.removeEventListener("pointerup", up);
      top.removeEventListener("pointercancel", up);
      top.classList.remove("dragging");
      if (Math.abs(dx) > 110) { fly(dx > 0); }
      else { top.style.transform = ""; yes.style.opacity = 0; no.style.opacity = 0; }
    };
    top.addEventListener("pointermove", mv);
    top.addEventListener("pointerup", up);
    top.addEventListener("pointercancel", up);
  });
}
function histChips() {
  let html = '<div class="dlabel">Decided</div><div class="dcard">';
  for (const d of decided.slice(0, 5)) {
    html += '<div class="drow"><div class="bd"><div class="ti" style="font-weight:650;color:' + (d.ok ? "var(--up)" : "var(--mut)") + '">' + d.txt + "</div></div></div>";
  }
  return html + "</div>";
}

/* ================= news rotation ================= */
setInterval(() => {
  if (state.editing || currentDetail) return;
  const line = grid.querySelector("#newsline");
  if (!line) return;
  line.style.opacity = "0";
  setTimeout(() => {
    state.newsIdx = (state.newsIdx + 1) % NEWS.length;
    const tile = grid.querySelector('.tile[data-id="news"] .tin');
    if (tile) tile.innerHTML = TILES.news.render();
  }, 260);
}, 5200);

/* ================= boot ================= */
renderGrid();
setTimeout(() => {
  toast("🦆 earnings-watch queued a NVDA trim — 3 approvals waiting", 3600);
}, 1400);
</script>
</body>
</html>
